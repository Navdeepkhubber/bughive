name: Fetch HackerOne Disclosed Reports

on:
  # Weekly, Sunday morning. GitHub Actions cron is UTC-only.
  #   Sunday 06:00 UTC == Sunday 11:30 IST
  # Previously this was '0 * * * *' (hourly), which hammered the HackerOne API and
  # produced a commit every hour. Was daily-equivalent in effect, now once a week.
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r intelligence/requirements.txt
      - name: Fetch new reports
        run: python intelligence/fetch-h1-reports.py
      - name: Commit queue to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          cp -n ~/.dsh/bounty-queue/h1-*.json reports/ 2>/dev/null || true
          git add reports/ || true
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || true
