subdomain_enum: [subfinder, amass, assetfinder, chaos]
dns:            [dnsx, massdns, shuffledns]
ports:          [naabu, masscan, nmap]
http_probe:     [httpx, httprobe]
content_disc:   [ffuf, feroxbuster, dirsearch]
active_crawl:   [katana]
passive_crawl:  [urlfinder, gau, waybackurls]
params:         [paramspider, arjun, x8]
js_analysis:    [linkfinder, jsluice, subjs]
fingerprint:    [wappalyzer, webanalyze, nuclei]
history:        [gau, waybackurls, katana]
cloud:          [cloud_enum, s3scanner]
screenshots:    [gowitness, aquatone]
# flow_mapping: executes real multi-step app flows (register, login,
# password reset, checkout, invite/referral) to surface business-logic and
# ATO surface that static per-endpoint recon can't see. Playwright is
# preferred: self-hosted, MIT-licensed, deterministic, records full HAR
# natively -- no target traffic leaves operator infrastructure, which
# matters for scope/NDA reasons in bug bounty work (rules out cloud
# browser-agent SaaS like Browserbase/Firecrawl/Skyvern for this use case).
# katana is the CLI-only fallback (discovery of flow entry points via
# -aff/-jc, no true multi-step execution). zap-baseline is an optional
# third tier if the operator already runs a ZAP daemon.
flow_mapping:   [playwright, katana, zap-baseline]
response_cache: [fff, curl]
secret_scan:    [trufflehog, gitleaks, kingfisher, rg]
vuln_scan:      [nuclei]
mass_oneliners: [qsreplace, httpx]
github_dorking: [gitdorker]
