id: password-reset
skills: [account-takeover, idor]
description: >
  Forgot-password flow. High-value for account takeover: predictable reset
  tokens, host-header-poisoned reset links, and email/username enumeration
  via response timing or copy differences.

entry_hints:
  path_patterns: ["/forgot-password", "/reset-password", "/password/forgot", "/account/recover"]
  link_text: ["forgot password", "forgot your password", "reset password"]

steps:
  - name: open_form
    action: goto
    side_effect: false

  - name: submit_identifier
    action: fill_fields
    side_effect: true   # sends a real email to whatever address is entered -- gated
    field_hints:
      email: ["email", "e-mail", "username"]
    synthetic_data:
      email_template: "bughive-flow+{run_id}@{synthetic_domain}"

observe:
  - response_differs_for_known_vs_unknown_email   # user enumeration
  - response_timing_differs                       # timing side channel, same purpose
  - reset_link_host_reflects_request_host          # host-header-injection candidate
  - reset_token_shape                              # short numeric / UUID / JWT -- feeds idor.md guessability triage
